<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iniciar sesión | KingToys</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#09090b;color:#f3f4f6;font:16px Inter,Arial,sans-serif}
main{width:min(420px,92vw);padding:32px;background:#1a1a24;border:1px solid #333;border-radius:16px}h1{margin-top:0;color:#fbc02d}label{display:block;margin:18px 0 6px}input{width:100%;padding:12px;border-radius:8px;border:1px solid #555;background:#121217;color:white}button{width:100%;margin-top:24px;padding:12px;border:0;border-radius:8px;background:#e62429;color:white;font-weight:bold;cursor:pointer}.error{padding:10px;background:#471c20;border-radius:8px;color:#ff9b9b}
</style></head><body><main><h1>KING TOYS</h1><h2>Inicio de sesión</h2>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" autocomplete="on"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label for="username">Usuario vendedor</label><input id="username" name="username" autocomplete="username" maxlength="80" required>
<label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
<button type="submit">Ingresar</button></form></main></body></html>
